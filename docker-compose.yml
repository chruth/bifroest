services:
  bifroest:
    build: .
    # Or, once published: image: ghcr.io/yourname/bifroest:latest
    container_name: bifroest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Any scalar setting in config.yaml can be overridden this way, not
      # just secrets - see config.example.yaml for the full naming rule.
      - BIFROEST_PLEX_URL=${PLEX_URL}
      - BIFROEST_PLEX_TOKEN=${PLEX_TOKEN}
      - BIFROEST_JELLYFIN_URL=${JELLYFIN_URL}
      - BIFROEST_JELLYFIN_TOKEN=${JELLYFIN_TOKEN}
      - BIFROEST_SOURCES_SONARR_MAIN_TOKEN=${SONARR_MAIN_TOKEN}
      - BIFROEST_SOURCES_RADARR_MAIN_TOKEN=${RADARR_MAIN_TOKEN}
    volumes:
      # Optional: only needed for path_maps (a prefix rewrite between the
      # Sonarr/Radarr and Plex/Jellyfin filesystem views). If every
      # instance sees identical paths on both sides, drop this mount and
      # BIFROEST_SOURCES_SONARR_MAIN_TOKEN above is enough to define it -
      # see README.md "Running without a config file".
      - ./config.yaml:/data/config.yaml:ro
      - ./data:/data
      # Read-only access to the same mount Plex/Jellyfin see, purely so the
      # application can stat the rclone anchor file.
      - /path/to/media:/media:ro
